services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary
      POSTGRES_DB: diary
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diary"]
      interval: 2s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://diary:diary@db:5432/diary
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
